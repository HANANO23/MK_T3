<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 매경테스트 최신기출 완벽대비 CBT 실전 모의고사 (80문항)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #cbd5e1;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #7f1d1d;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 12px;
    }

    .app-header h1 {
      font-size: 1.25rem;
      color: var(--text-main);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: #ef4444;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-warning {
      background-color: #d97706;
      color: white;
    }

    .cbt-container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 968px) {
      .cbt-container {
        grid-template-columns: 1fr;
      }
      body {
        padding: 10px;
      }
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-badge {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .mode-badge {
      background-color: #fef2f2;
      color: #ef4444;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
    }

    .progress-text {
      font-size: 0.95rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      word-break: keep-all;
      line-height: 1.6;
      color: #1e293b;
    }

    .question-box {
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.65;
    }

    .cbt-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      background: #ffffff;
      font-size: 0.9rem;
    }

    .cbt-table th, .cbt-table td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: center;
    }

    .cbt-table th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #1e293b;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background-color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: keep-all;
      color: #334155;
      font-weight: 500;
    }

    .option-btn:hover:not(.correct):not(.wrong) {
      background-color: #f8fafc;
      border-color: var(--primary);
      color: var(--primary);
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 700;
    }

    .explanation-box {
      margin-top: 15px;
      padding: 20px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      white-space: pre-line;
      line-height: 1.65;
      color: #166534;
      font-size: 0.95rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .navigation-bar {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 12px 24px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      color: #334155;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }

    .keyboard-tip {
      font-size: 0.82rem;
      color: var(--text-sub);
      text-align: center;
      font-weight: 500;
      width: 100%;
    }

    @media(min-width: 768px) {
      .keyboard-tip { width: auto; }
    }

    .sidebar-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 16px;
    }

    .omr-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .omr-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-summary {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .omr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .omr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      background-color: #fff;
      transition: all 0.15s;
    }

    .omr-item:hover {
      border-color: var(--primary);
      background-color: #f8fafc;
    }

    .omr-item.active {
      border-color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-none { background: #f1f5f9; color: var(--text-sub); }
    .status-correct { background: var(--correct-bg); color: var(--correct-text); }
    .status-wrong { background: var(--wrong-bg); color: var(--wrong-text); }

    @media (max-width: 768px) {
      .question-card { padding: 18px; }
      .app-header { padding: 12px 16px; }
      .omr-grid { max-height: 350px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>🎯 2026 매경테스트 최신기출 완벽대비 CBT 실전 모의고사 (80문항)</h1>
    <div class="header-btns">
      <button id="wrongOnlyBtn" class="btn-action btn-danger" onclick="filterWrongQuestions()">틀린 문제만 모아보기</button>
      <button id="showAllBtn" class="btn-action btn-secondary" onclick="showAllQuestions()" style="display:none;">전체 문제 보기</button>
      <button class="btn-action" onclick="resetAndShuffle()">리셋 & 순서 섞기</button>
    </div>
  </header>

  <div class="cbt-container">
    <main class="question-card">
      <div>
        <div class="question-header">
          <div class="badge-group">
            <span id="categoryBadge" class="category-badge">[분야] 경영·경제</span>
            <span id="modeBadge" class="mode-badge">오답 복습 모드</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="reselectBtn" class="btn-action btn-warning" style="display:none; padding: 6px 12px; font-size: 0.8rem;" onclick="reselectAnswer()">🔄 답 다시 선택</button>
            <span class="progress-text"><strong id="currentIndex">1</strong> / <span id="totalIndex">80</span></span>
          </div>
        </div>

        <div id="questionTitle" class="question-title"></div>
        <div id="questionBox" class="question-box" style="display:none;"></div>
        <div id="optionsList" class="options-list"></div>
        <div id="explanationBox" class="explanation-box" style="display: none;"></div>
      </div>

      <div class="navigation-bar">
        <button id="prevBtn" class="nav-btn" onclick="prevQuestion()">◀ 이전</button>
        <span class="keyboard-tip">💡 정답 보기를 <strong>더블 클릭(더블 탭)</strong> 시 다음 문제로 바로 넘어갑니다</span>
        <button id="nextBtn" class="nav-btn" onclick="nextQuestion()">다음 ▶</button>
      </div>
    </main>

    <aside class="sidebar-card">
      <div class="omr-header">
        <h3>OMR 답안지</h3>
        <span id="scoreSummary" class="score-summary">맞힘: 0 / 80</span>
      </div>
      <div id="omrGrid" class="omr-grid"></div>
    </aside>
  </div>

  <script>
    const originalQuestions = [
      {
        id: 1,
        category: "[경영] 합명회사",
        question: "Q1. 다음 지문에서 설명하는 상법상 기업의 형태는 무엇인가?",
        boxContent: "무한책임사원으로만 구성되는 회사로, 출자자는 회사의 채권자에 대하여 직접·무한·연대책임을 진다. 조합적 성격이 강하며, 사원 간의 인적 신뢰관계가 중시되므로 친족이나 가족 중심의 동업 형태에 적합하다.",
        options: ["① 주식회사", "② 합명회사", "③ 합자회사", "④ 유한회사", "⑤ 유한책임회사"],
        answer: 2,
        explanation: "[해설]\n\n[O] ② 합명회사: 모든 사원이 회사의 채권자에 대해 직접·무한·연대책임을 진다.\n\n[각 보기별 분석]\n① [X] 주식회사: 유한책임사원으로만 구성.\n③ [X] 합자회사: 무한+유한책임사원 복합.\n④ [X] 유한회사: 출자액 한도 유한책임.\n⑤ [X] 유한책임회사: 신유형 유한책임 기업.\n\n정답 ②"
      },
      {
        id: 2,
        category: "[경영] OJT",
        question: "Q2. 다음 중 직무 현장에서 상사나 선임자로부터 실제 업무를 직접 수행하면서 필요한 기술과 지식을 배우는 인적자원개발(HRD) 방식을 가리키는 용어는?",
        options: ["① Off-JT", "② OJT", "③ 시뮬레이션 훈련", "④ 액션 러닝", "⑤ 이러닝"],
        answer: 2,
        explanation: "[해설]\n\n[O] ② OJT: 직장내 실무 현장 교육훈련.\n\n[각 보기별 분석]\n① [X] Off-JT: 집체 연수원 교육.\n③ [X] 시뮬레이션: 모의 훈련.\n④ [X] 액션 러닝: 현안 해결 실전 학습.\n⑤ [X] 이러닝: 원격 온라인 학습.\n\n정답 ②"
      },
      {
        id: 3,
        category: "[경영] 관리모형(리더십)",
        question: "Q3. 블레이크와 모튼(Blake & Mouton)의 관리모형(Managerial Grid)에 관한 설명이다. 아래 표의 (가)와 (나)에 들어갈 축의 개념을 올바르게 짝지은 것은?",
        boxContent: `
          <table class="cbt-table">
            <thead>
              <tr>
                <th>구분</th>
                <th>설명</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><b>격자 축 구성</b></td>
                <td>리더십 그리드는 <b>(가)</b>에 대한 관심과 <b>(나)</b>에 대한 관심을 두 축으로 9×9 격자로 분류함</td>
              </tr>
              <tr>
                <td><b>팀형 (9, 9)</b></td>
                <td>(가)와 (나) 모두에 대해 높은 관심을 보이는 가장 이상적인 리더십 유형</td>
              </tr>
            </tbody>
          </table>
        `,
        options: ["① (가) 과업 - (나) 인간", "② (가) 인간 - (나) 과업", "③ (가) 권한 - (나) 조직", "④ (가) 목표 - (나) 매출", "⑤ (가) 기술 - (나) 환경"],
        answer: 1,
        explanation: "[해설]\n\n[O] ① (가) 과업 - (나) 인간: 리더십 그리드 수평축은 과업, 수직축은 인간에 대한 관심이다.\n\n정답 ①"
      },
      {
        id: 4,
        category: "[경영] 정서적 몰입",
        question: "Q4. 다음은 조직몰입의 세 가지 차원에 대한 설명이다. 제시된 사례에 해당하는 조직몰입의 유형은?",
        boxContent: "김 대리는 자신이 속한 회사의 가치관과 경영 목표에 깊이 공감하고 있으며, 회사를 진심으로 사랑하여 스스로 조직의 구성원으로 남기를 강력하게 희망하고 있다.",
        options: ["① 지속적 몰입", "② 정서적 몰입", "③ 규범적 몰입", "④ 수단적 몰입", "⑤ 강제적 몰입"],
        answer: 2,
        explanation: "[해설]\n\n[O] ② 정서적 몰입: 조직 가치관 공감 및 애정에 따른 자발적 몰입.\n\n정답 ②"
      },
      {
        id: 5,
        category: "[경영] 수직적 통합",
        question: "Q5. 다음 중 수직적 통합(Vertical Integration) 전략 중 '후방통합(Backward Integration)'의 대표적인 예시로 가장 적절한 것은?",
        options: ["① 제과 업체가 유통망 확대를 위해 대형 마트를 인수하는 경우", "② 제빵 기업이 안정적인 원재료 공급을 위해 밀가루 방앗간이나 밀 농장을 인수하는 경우", "③ 자동차 제조사가 경쟁 자동차 업체를 인수합병(M&A)하는 경우", "④ 스마트폰 제조사가 가전제품 시장에 신규 진출하는 경우", "⑤ 의류 브랜드가 자회사 형태로 직영 판매점을 개설하는 경우"],
        answer: 2,
        explanation: "[해설]\n\n[O] ②: 원재료 공급 단계로 역방향 확장하는 것이 후방통합이다.\n\n정답 ②"
      },
      {
        id: 6,
        category: "[경영] 손익분기점",
        question: "Q6. A 기업의 고정비가 10,000,000원이고, 제품 개당 판매가격이 100,000원, 개당 변동비가 50,000원일 때, 손익분기점(BEP) 매출량은 몇 개인가?",
        options: ["① 100개", "② 150개", "③ 200개", "④ 250개", "⑤ 300개"],
        answer: 3,
        explanation: "[해설]\n\n[O] ③ 10,000,000 ÷ (100,000 - 50,000) = 200개.\n\n정답 ③"
      },
      {
        id: 7,
        category: "[경제] 통화승수",
        question: "Q7. 중앙은행이 공급한 본원통화가 신용창출 과정을 거쳐 통화량을 얼마나 늘렸는지를 나타내는 지표로, '총통화량 ÷ 본원통화'로 산출되는 개념은?",
        options: ["① 통화승수", "② 지급준비율", "③ 환매조건부채권", "④ 총통화비율", "⑤ 유동성선호율"],
        answer: 1,
        explanation: "[해설]\n\n[O] ① 통화승수: 본원통화 대비 통화량 배수.\n\n정답 ①"
      },
      {
        id: 8,

        options: ["① 공유 경제", "② 긱 이코노미", "③ 구독 경제", "④ 토큰 경제", "⑤ 순환 경제"],
        answer: 2,
        explanation: "[해설]\n\n[O] ② 긱 이코노미(Gig Economy): 임시직 및 단기 계약 중심의 유연한 노동 시장 트렌드입니다.\n\n[각 보기별 분석]\n① [X] 공유 경제: 자산을 여럿이 공유해 사용하는 경제 모델입니다.\n③ [X] 구독 경제: 정기 비용을 지불하고 제품/서비스를 이용하는 모델입니다.\n④ [X], ⑤ [X]: 디지털 자산 및 자원 재순환 관련 용어입니다.\n\n정답 ②"

        options: ["① 현물거래", "② 선물거래", "③ 선도거래", "④ 옵션거래", "⑤ 스왑거래"],

      },
      {

        category: "[경영] 제로클릭",

        options: ["① 원클릭", "② 제로클릭", "③ 딥클릭", "④ 패스트클릭", "⑤ 에코클릭"],
        answer: 2,
        explanation: "[해설]\n\n[O] ② 제로클릭(Zero-click): 검색 결과 페이지 내에서 정보가 완결되어 외부 링크 클릭이 0회인 현상입니다.\n\n[각 보기별 분석]\n① [X], ③ [X], ④ [X], ⑤ [X]: 검색 트렌드 용어인 제로클릭과 무관한 보기입니다.\n\n정답 ②"

      {

        options: ["① 그린 마케팅", "② 코즈 마케팅", "③ 틈새 마케팅", "④ 바이럴 마케팅", "⑤ 감성 마케팅"],
        answer: 2,
        explanation: "[해설]\n\n[O] ② 코즈 마케팅(Cause Marketing): 사회적 공익(Cause)과 상업적 마케팅을 결합한 전략입니다.\n\n[각 보기별 분석]\n① [X] 그린 마케팅: 친환경 가치를 중심에 둔 마케팅 기법입니다.\n③ [X] 틈새 마케팅: 특정 세분 시장을 공략하는 전략입니다.\n④ [X] 바이럴 마케팅: 입소문을 통해 확산시키는 홍보 방식입니다.\n⑤ [X] 감성 마케팅: 소비자의 감정을 자극하는 마케팅입니다.\n\n정답 ②"
      }
    ];

    let currentQuestions = [...originalQuestions];
    let currentIndex = 0;
    let userAnswers = {};
    let isWrongOnlyMode = false;
    let clickTimers = {};

    function initApp() {
      document.getElementById('totalIndex').innerText = currentQuestions.length;
      renderQuestion();
      renderOMR();
      updateScoreSummary();
    }

    function renderQuestion() {
      if (!currentQuestions || currentQuestions.length === 0) return;
      const q = currentQuestions[currentIndex];

      document.getElementById('categoryBadge').innerText = q.category;
      document.getElementById('currentIndex').innerText = currentIndex + 1;
      document.getElementById('totalIndex').innerText = currentQuestions.length;
      document.getElementById('questionTitle').innerHTML = q.question;

      const qBox = document.getElementById('questionBox');
      if (q.boxContent) {
        qBox.style.display = 'block';
        qBox.innerHTML = q.boxContent;
      } else {
        qBox.style.display = 'none';
        qBox.innerHTML = '';
      }

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      const selectedOpt = userAnswers[q.id];
      const reselectBtn = document.getElementById('reselectBtn');

      q.options.forEach((optText, idx) => {
        const optNum = idx + 1;
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = optText;

        if (selectedOpt !== undefined) {
          if (optNum === q.answer) {
            btn.classList.add('correct');
          } else if (optNum === selectedOpt) {
            btn.classList.add('wrong');
          }
        }

        btn.onclick = (e) => handleOptionClick(q.id, optNum, e);
        btn.ontouchend = (e) => {
          e.preventDefault();
          handleOptionClick(q.id, optNum, e);
        };

        optionsList.appendChild(btn);
      });

      if (selectedOpt === undefined) {
        reselectBtn.style.display = 'none';
      } else {
        reselectBtn.style.display = 'inline-block';
      }

      const expBox = document.getElementById('explanationBox');
      if (selectedOpt !== undefined) {
        expBox.style.display = 'block';
        expBox.innerHTML = q.explanation.replace(/\n/g, '<br>');
      } else {
        expBox.style.display = 'none';
        expBox.innerHTML = '';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === currentQuestions.length - 1);

      updateOMRActive();
    }

    function handleOptionClick(qId, optNum, event) {
      const now = new Date().getTime();
      const currentAns = userAnswers[qId];

      if (currentAns === undefined) {
        userAnswers[qId] = optNum;
        renderQuestion();
        renderOMR();
        updateScoreSummary();
        clickTimers[qId] = { time: now, opt: optNum };
      } else {
        const lastClick = clickTimers[qId];
        if (lastClick && (lastClick.opt === optNum || (now - lastClick.time < 600))) {
          nextQuestion();
        } else {
          clickTimers[qId] = { time: now, opt: optNum };
        }
      }
    }

    function reselectAnswer() {
      const q = currentQuestions[currentIndex];
      if (confirm(`Q${q.id}번의 선택한 답을 초기화하고 다시 풀시겠습니까?`)) {
        delete userAnswers[q.id];
        renderQuestion();
        renderOMR();
        updateScoreSummary();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function renderOMR() {
      const omrGrid = document.getElementById('omrGrid');
      omrGrid.innerHTML = '';

      currentQuestions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'omr-item';
        if (idx === currentIndex) item.classList.add('active');

        const userAns = userAnswers[q.id];
        let statusText = '-';
        let statusClass = 'status-none';

        if (userAns !== undefined) {
          if (userAns === q.answer) {
            statusText = '정답';
            statusClass = 'status-correct';
          } else {
            statusText = '오답';
            statusClass = 'status-wrong';
          }
        }

        item.innerHTML = `
          <span>Q${String(q.id).padStart(2, '0')}</span>
          <span class="status-badge ${statusClass}">${statusText}</span>
        `;

        item.onclick = () => {
          currentIndex = idx;
          renderQuestion();
        };

        omrGrid.appendChild(item);
      });
    }

    function updateOMRActive() {
      const items = document.querySelectorAll('.omr-item');
      items.forEach((item, idx) => {
        if (idx === currentIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function updateScoreSummary() {
      let correctCount = 0;
      originalQuestions.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
          if (userAnswers[q.id] === q.answer) correctCount++;
        }
      });
      document.getElementById('scoreSummary').innerText = `맞힘: ${correctCount} / ${originalQuestions.length}`;
    }

    function resetAndShuffle() {
      if (confirm('모든 답안을 초기화하고 문제 순서를 섞으시겠습니까?')) {
        isWrongOnlyMode = false;
        userAnswers = {};
        clickTimers = {};
        currentQuestions = [...originalQuestions].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        
        document.getElementById('modeBadge').style.display = 'none';
        document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
        document.getElementById('showAllBtn').style.display = 'none';
        
        initApp();
      }
    }

    function filterWrongQuestions() {
      const wrongList = originalQuestions.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.answer);

      if (wrongList.length === 0) {
        alert('틀린 문제가 없습니다! (풀지 않았거나 모두 정답인 상태입니다)');
        return;
      }

      isWrongOnlyMode = true;
      currentQuestions = wrongList;
      currentIndex = 0;

      document.getElementById('modeBadge').innerText = `오답 복습 (${wrongList.length}개)`;
      document.getElementById('modeBadge').style.display = 'inline-block';
      document.getElementById('wrongOnlyBtn').style.display = 'none';
      document.getElementById('showAllBtn').style.display = 'inline-block';

      initApp();
    }

    function showAllQuestions() {
      isWrongOnlyMode = false;
      currentQuestions = [...originalQuestions];
      currentIndex = 0;

      document.getElementById('modeBadge').style.display = 'none';
      document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
      document.getElementById('showAllBtn').style.display = 'none';

      initApp();
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        nextQuestion();
      }
    });

    window.onload = initApp;
  </script>
