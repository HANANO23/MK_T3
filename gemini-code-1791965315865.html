<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 매경테스트 최신기출 완벽대비 CBT 실전 모의고사 (70문항)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #cbd5e1;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #7f1d1d;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 12px;
    }

    .app-header h1 {
      font-size: 1.25rem;
      color: var(--text-main);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: #ef4444;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .btn-secondary {
      background-color: #64748b;
      box-shadow: 0 2px 4px rgba(100, 116, 139, 0.2);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .cbt-container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 968px) {
      .cbt-container {
        grid-template-columns: 1fr;
      }
      body {
        padding: 10px;
      }
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .category-badge {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .mode-badge {
      background-color: #fef2f2;
      color: #ef4444;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
      margin-left: 8px;
    }

    .progress-text {
      font-size: 0.95rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 24px;
      word-break: keep-all;
      line-height: 1.65;
      color: #1e293b;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background-color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: keep-all;
      color: #334155;
      font-weight: 500;
    }

    .option-btn:hover:not(.correct):not(.wrong) {
      background-color: #f8fafc;
      border-color: var(--primary);
      color: var(--primary);
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 700;
    }

    .explanation-box {
      margin-top: 15px;
      padding: 20px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      white-space: pre-line;
      line-height: 1.65;
      color: #166534;
      font-size: 0.95rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .navigation-bar {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      padding: 12px 24px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      color: #334155;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }

    .keyboard-tip {
      font-size: 0.82rem;
      color: var(--text-sub);
      text-align: center;
      font-weight: 500;
    }

    .sidebar-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 16px;
    }

    .omr-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .omr-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-summary {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .omr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .omr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      background-color: #fff;
      transition: all 0.15s;
    }

    .omr-item:hover {
      border-color: var(--primary);
      background-color: #f8fafc;
    }

    .omr-item.active {
      border-color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-none { background: #f1f5f9; color: var(--text-sub); }
    .status-correct { background: var(--correct-bg); color: var(--correct-text); }
    .status-wrong { background: var(--wrong-bg); color: var(--wrong-text); }

    @media (max-width: 768px) {
      .question-card { padding: 18px; }
      .app-header { padding: 12px 16px; }
      .omr-grid { max-height: 350px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>🎯 116회 기출 복기 & 2026 최신 매경테스트 70문항 CBT</h1>
    <div class="header-btns">
      <button id="wrongOnlyBtn" class="btn-action btn-danger" onclick="filterWrongQuestions()">틀린 문제만 모아보기</button>
      <button id="showAllBtn" class="btn-action btn-secondary" onclick="showAllQuestions()" style="display:none;">전체 문제 보기</button>
      <button class="btn-action" onclick="resetAndShuffle()">리셋 & 순서 섞기</button>
    </div>
  </header>

  <div class="cbt-container">
    <main class="question-card">
      <div>
        <div class="question-header">
          <div>
            <span id="categoryBadge" class="category-badge">[분야] 경영·경제 핵심</span>
            <span id="modeBadge" class="mode-badge">오답 복습 모드</span>
          </div>
          <span class="progress-text"><strong id="currentIndex">1</strong> / <span id="totalIndex">70</span></span>
        </div>

        <div id="questionTitle" class="question-title"></div>
        <div id="optionsList" class="options-list"></div>
        <div id="explanationBox" class="explanation-box" style="display: none;"></div>
      </div>

      <div class="navigation-bar">
        <button id="prevBtn" class="nav-btn" onclick="prevQuestion()">◀ 이전</button>
        <span class="keyboard-tip">💡 [Spacebar] 또는 정답/보기 <strong>더블클릭</strong> 시 다음 이동</span>
        <button id="nextBtn" class="nav-btn" onclick="nextQuestion()">다음 ▶</button>
      </div>
    </main>

    <aside class="sidebar-card">
      <div class="omr-header">
        <h3>OMR 답안지</h3>
        <span id="scoreSummary" class="score-summary">맞힘: 0 / 70</span>
      </div>
      <div id="omrGrid" class="omr-grid"></div>
    </aside>
  </div>

  <script>
    const originalQuestions = [
      {
        id: 1,
        category: "[경영] 합명회사",
        question: "Q1. 상법상 무한책임사원만으로 구성되며, 회사의 채무에 대해 연대하여 직접 무한책임을 지는 인적 회사 형태는 무엇인가?",
        options: ["① 합명회사", "② 합자회사", "③ 유한회사", "④ 주식회사", "⑤ 유한책임회사"],
        answer: 1,
        explanation: "[정답] ①\n\n- 합명회사는 모든 사원이 회사의 채무에 대해 직접 무한책임을 부담하는 전형적인 인적 회사입니다.\n- 합자회사는 무한책임사원과 유한책임사원으로 함께 구성됩니다."
      },
      {
        id: 2,
        category: "[경영] OJT",
        question: "Q2. 실제 직무를 수행하는 현장에서 상사나 선배의 지도 아래 지식과 기술을 습득하는 교육훈련(OJT)의 특징으로 가장 적절하지 않은 것은?",
        options: [
          "① 개별 수강자의 능력과 수준에 맞춘 개별 지도가 가능하다.",
          "② 현업에 즉시 적용 가능한 실무 지식을 습득할 수 있다.",
          "③ 대규모 인원을 대상으로 표준화된 이론을 일괄 교육하기에 가장 적합하다.",
          "④ 교육 비용이 상대적으로 저렴하고 별도의 연수원 시설이 크게 필요 없다.",
          "⑤ 훈련 과정 중에도 업무 공백을 최소화할 수 있다."
        ],
        answer: 3,
        explanation: "[정답] ③\n\n대규모 인원을 대상으로 표준화된 이론을 일괄 교육하는 방식은 직장 외 교육(Off-JT)에 적합합니다. OJT는 현장 밀착형 개별 지도 방식입니다."
      },
      {
        id: 3,
        category: "[경영] 관리모형(리더십)",
        question: "Q3. 블레이크와 모튼(Blake & Mouton)의 관리모형(Managerial Grid)에서 인간에 대한 관심은 극도로 낮고 생산(업무)에 대한 관심은 극도로 높은 리더십 유형은 무엇인가?",
        options: ["① 컨트리클럽형", "② 무기력형", "③ 중용형", "④ 과업형 (권위-복종형)", "⑤ 팀형"],
        answer: 4,
        explanation: "[정답] ④\n\n- 과업형(9,1)은 생산에 대한 관심은 극대화하고 인간에 대한 관심은 경시하는 권위주의적 리더십입니다.\n- 컨트리클럽형은 인간 관심 높음/생산 관심 낮음(1,9)입니다."
      },
      {
        id: 4,
        category: "[경영] 정서적 몰입",
        question: "Q4. 조직 구성원이 조직의 목표와 가치에 깊이 공감하고, 조직에 대한 강한 애착과 귀속 의식을 느껴 자발적으로 헌신하려는 태도를 무엇이라 하는가?",
        options: ["① 정서적 몰입", "② 지속적 몰입", "③ 규범적 몰입", "④ 인지적 부조화", "⑤ 직무 만족"],
        answer: 1,
        explanation: "[정답] ①\n\n- 정서적 몰입(Affective Commitment)은 조직에 대한 감정적 애착과 일체감을 의미합니다.\n- 지속적 몰입은 이탈 비용 때문에 잔류하는 상태입니다."
      },
      {
        id: 5,
        category: "[경영] 수직적 통합",
        question: "Q5. 제빵 대기업이 원재료인 밀가루를 직접 안정적으로 조달하기 위해 제분 공장을 인수하거나 설립하여 공급망을 통제하는 전략은 무엇인가?",
        options: ["① 전방 통합", "② 후방 통합", "③ 수평적 통합", "④ 다각화 전략", "⑤ 아웃소싱"],
        answer: 2,
        explanation: "[정답] ②\n\n- 후방 통합(Backward Integration)은 공급자(원재료) 단계로 기업의 가치사슬을 확장하는 것입니다.\n- 전방 통합은 유통·판매망 쪽으로 확장하는 것입니다."
      },
      {
        id: 6,
        category: "[경영] 손익분기점",
        question: "Q6. 어떤 기업의 고정비가 1,000,000원이고 제품 단위당 판매가격이 10,000원, 단위당 변동비가 5,000원일 때, 손익분기점(BEP) 판매 수량은 몇 개인가?",
        options: ["① 100개", "② 150개", "③ 200개", "④ 250개", "⑤ 300개"],
        answer: 3,
        explanation: "[정답] ③\n\n손익분기점 수량 = 고정비 / (단가 - 단위당변동비) = 1,000,000 / (10,000 - 5,000) = 200개입니다."
      },
      {
        id: 7,
        category: "[경제] 통화승수",
        question: "Q7. 본원통화(H) 대비 통화량(M)의 크기 비율을 나타내며, 중앙은행이 공급한 본원통화가 시중에 얼마나 많은 통화를 창출했는지 보여주는 지표는?",
        options: ["① 지준율", "② 통화승수", "③ 화폐유통속도", "④ 할인율", "⑤ 이자율"],
        answer: 2,
        explanation: "[정답] ②\n\n통화승수(Money Multiplier)는 M/H로 정의되며 본원통화가 몇 배의 통화량으로 확대되었는지를 나타내는 배수입니다."
      },
      {
        id: 8,
        category: "[경제] 화폐환상",
        question: "Q8. 사람들이 인플레이션으로 인해 물가와 명목임금이 함께 올랐음에도 불구하고, 화폐의 실질 가치 변화를 정확히 인지하지 못하고 명목 가치 증가에만 착각을 일으키는 현상은?",
        options: ["① 구조적 실업", "② 화폐환상", "③ 구축효과", "④ 유동성 함정", "⑤ 역선택"],
        answer: 2,
        explanation: "[정답] ②\n\n화폐환상(Money Illusion)은 명목변수와 실질변수를 혼동하여 실질 가치는 그대로인데 명목 수치 상승에 기뻐하는 심리적 현상입니다."
      },
      {
        id: 9,
        category: "[경영] 캐시카우",
        question: "Q9. BCG 매트릭스에서 시장 성장률은 낮으나 상대적 시장 점유율이 높아 막대한 현금 창출력을 지닌 사업부를 의미하는 용어는?",
        options: ["① 물음표", "② 스타", "③ 캐시카우", "④ 개(Dog)", "⑤ 도그마"],
        answer: 3,
        explanation: "[정답] ③\n\n캐시카우(Cash Cow)는 저성장-고점유율 사업부로, 우유를 짜내듯 꾸준히 안정적 현금을 창출합니다."
      },
      {
        id: 10,
        category: "[경영] 로열티",
        question: "Q10. 프랜차이즈 본사가 가맹점에 브랜드 상표권 사용 및 노하우 전수의 대가로 정기적으로 부과하는 브랜드 사용료를 무엇이라 하는가?",
        options: ["① 초기 가맹비", "② 로열티", "③ 감가상각비", "④ 예비비", "⑤ 보증금"],
        answer: 2,
        explanation: "[정답] ②\n\n로열티(Royalty)는 브랜드 이름과 경영 노하우를 사용하는 대가로 정기 지급하는 비용입니다."
      },
      {
        id: 11,
        category: "[경영] 연공급",

    let currentQuestions = [...originalQuestions];
    let currentIndex = 0;
    let userAnswers = {};
    let isWrongOnlyMode = false;
    let clickTimers = {};

    function initApp() {
      document.getElementById('totalIndex').innerText = currentQuestions.length;
      renderQuestion();
      renderOMR();
      updateScoreSummary();
    }

    function renderQuestion() {
      if (!currentQuestions || currentQuestions.length === 0) return;
      const q = currentQuestions[currentIndex];

      document.getElementById('categoryBadge').innerText = q.category;
      document.getElementById('currentIndex').innerText = currentIndex + 1;
      document.getElementById('totalIndex').innerText = currentQuestions.length;
      document.getElementById('questionTitle').innerText = q.question;

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      const selectedOpt = userAnswers[q.id];

      q.options.forEach((optText, idx) => {
        const optNum = idx + 1;
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;

        if (selectedOpt !== undefined) {
          if (optNum === q.answer) {
            btn.classList.add('correct');
          } else if (optNum === selectedOpt) {
            btn.classList.add('wrong');
          }
          btn.disabled = true;
        } else {
          btn.onclick = () => handleOptionClick(q.id, optNum);
        }

        optionsList.appendChild(btn);
      });

      const expBox = document.getElementById('explanationBox');
      if (selectedOpt !== undefined) {
        expBox.style.display = 'block';
        expBox.innerText = q.explanation;
      } else {
        expBox.style.display = 'none';
        expBox.innerText = '';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === currentQuestions.length - 1);

      updateOMRActive();
    }

    function handleOptionClick(qId, optNum) {
      const now = new Date().getTime();

      if (userAnswers[qId] === undefined) {
        userAnswers[qId] = optNum;
        renderQuestion();
        renderOMR();
        updateScoreSummary();
        clickTimers[qId] = { time: now, opt: optNum };
      } else {
        const lastClick = clickTimers[qId];
        if (lastClick && lastClick.opt === optNum && (now - lastClick.time < 600)) {
          nextQuestion();
        } else {
          clickTimers[qId] = { time: now, opt: optNum };
        }
      }
    }

    document.addEventListener('dblclick', function(e) {
      if (e.target.classList.contains('option-btn')) {
        nextQuestion();
      }
    });

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function renderOMR() {
      const omrGrid = document.getElementById('omrGrid');
      omrGrid.innerHTML = '';

      currentQuestions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'omr-item';
        if (idx === currentIndex) item.classList.add('active');

        const userAns = userAnswers[q.id];
        let statusText = '-';
        let statusClass = 'status-none';

        if (userAns !== undefined) {
          if (userAns === q.answer) {
            statusText = '정답';
            statusClass = 'status-correct';
          } else {
            statusText = '오답';
            statusClass = 'status-wrong';
          }
        }

        item.innerHTML = `
          <span>Q${String(q.id).padStart(2, '0')}</span>
          <span class="status-badge ${statusClass}">${statusText}</span>
        `;

        item.onclick = () => {
          currentIndex = idx;
          renderQuestion();
        };

        omrGrid.appendChild(item);
      });
    }

    function updateOMRActive() {
      const items = document.querySelectorAll('.omr-item');
      items.forEach((item, idx) => {
        if (idx === currentIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function updateScoreSummary() {
      let correctCount = 0;
      originalQuestions.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
          if (userAnswers[q.id] === q.answer) correctCount++;
        }
      });
      document.getElementById('scoreSummary').innerText = `맞힘: ${correctCount} / ${originalQuestions.length}`;
    }

    function resetAndShuffle() {
      if (confirm('모든 답안을 초기화하고 문제 순서를 섞으시겠습니까?')) {
        isWrongOnlyMode = false;
        userAnswers = {};
        clickTimers = {};
        currentQuestions = [...originalQuestions].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        
        document.getElementById('modeBadge').style.display = 'none';
        document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
        document.getElementById('showAllBtn').style.display = 'none';
        
        initApp();
      }
    }

    function filterWrongQuestions() {
      const wrongList = originalQuestions.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.answer);

      if (wrongList.length === 0) {
        alert('틀린 문제가 없습니다! (풀지 않았거나 모두 정답인 상태입니다)');
        return;
      }

      isWrongOnlyMode = true;
      currentQuestions = wrongList;
      currentIndex = 0;

      document.getElementById('modeBadge').innerText = `오답 복습 (${wrongList.length}개)`;
      document.getElementById('modeBadge').style.display = 'inline-block';
      document.getElementById('wrongOnlyBtn').style.display = 'none';
      document.getElementById('showAllBtn').style.display = 'inline-block';

      initApp();
    }

    function showAllQuestions() {
      isWrongOnlyMode = false;
      currentQuestions = [...originalQuestions];
      currentIndex = 0;

      document.getElementById('modeBadge').style.display = 'none';
      document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
      document.getElementById('showAllBtn').style.display = 'none';

      initApp();
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        nextQuestion();
      }
    });

    window.onload = initApp;
  </script>
</body>
</html>
